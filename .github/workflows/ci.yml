name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads .ruby-version, runs bundle install, caches gems
      - run: bundle exec rspec
